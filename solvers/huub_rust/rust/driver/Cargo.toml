[package]
name = "dcp_huub"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dcp_huub"
path = "src/lib.rs"

[dependencies]
huub = "=100.1.0"
serde_json = "=1.0.151"

# huub's own release profile does not apply to dependents, so the profile that
# builds the rlibs the submissions link against is set here.
[profile.release]
debug = false
strip = "symbols"
incremental = false
