name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache generated dataset jsonl
        id: cache-jsonl
        uses: actions/cache@v4
        with:
          path: dcp-bench-open.jsonl
          key: jsonl-${{ hashFiles('dataset/**', 'jsonl_convert.py', 'requirements.txt') }}
      - name: Generate dataset jsonl
        if: steps.cache-jsonl.outputs.cache-hit != 'true'
        run: python jsonl_convert.py
      - name: Generate website
        run: python generate_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
